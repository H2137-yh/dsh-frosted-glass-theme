# dsh-frosted-glass-theme 的 bundle 补丁层：把主题作为一行插进 profile 的条目列表。
#
# name 必须是【裸包名】dsh-frosted-glass-theme —— dsh-web 的客户端模块扫描只解析
# 裸包名行，靠这行找到本包的 package.json、读到 dsh.client 字段，
# 才会把 client.js（磨砂玻璃 CSS + 底图）服务给网页。
#
# 主题是互斥的：dshmarket「主题」页切换主题时会禁用其它主题插件、只启用一个。
- insert:
    - id: dsh-frosted-glass-theme
      name: dsh-frosted-glass-theme
